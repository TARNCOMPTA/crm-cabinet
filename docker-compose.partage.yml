# ============================================================================
# CRM Cabinet — déploiement derrière un Caddy DÉJÀ EN PLACE.
#
#   docker compose -f docker-compose.partage.yml up -d --build
#
# À utiliser quand le serveur héberge plusieurs applications derrière un seul
# Caddy — le cas du VPS de TARN COMPTA, où le Caddy du portail sert aussi n8n,
# factursci, cottns et portailrecup.
#
# La différence avec `docker-compose.yml` tient en deux points :
#   · aucun service `caddy`, et AUCUN port publié sur l'hôte. Un second Caddy
#     ne pourrait pas se lier à 80/443, déjà pris par le premier ;
#   · `app` rejoint le réseau externe du Caddy sous un alias, ce qui le rend
#     joignable par `reverse_proxy crmcabinet:3000`.
#
# Le bloc à ajouter au Caddyfile partagé est dans `installation/Caddyfile.extrait`.
#
# Pour un VPS dédié — le cas d'un confrère qui installe le produit —, c'est
# `docker-compose.yml` qu'il faut utiliser : il embarque son propre Caddy.
# ============================================================================
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crmcabinet}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      POSTGRES_INITDB_ARGS: '--locale=C.UTF-8 --encoding=UTF8'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crmcabinet}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Réseau interne au projet uniquement : la base n'est visible ni de l'hôte,
    # ni des autres applications du serveur.
    networks:
      - default

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crmcabinet}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ''
      PGRST_JWT_SECRET: ${SESSION_SECRET:?SESSION_SECRET est obligatoire}
      PGRST_SERVER_PORT: 3001
      PGRST_DB_MAX_ROWS: 10000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3001'
    networks:
      - default

  app:
    build: .
    restart: unless-stopped
    # Pas de « init: true » ici : l'image a deja tini en ENTRYPOINT. Les deux
    # ensemble placent l'init de Docker en PID 1 et releguent tini en PID 2, ce
    # qui lui fait perdre precisement ce qu'on lui demande — il l'annonce
    # lui-meme au demarrage (« Tini is not running as PID 1 »). Le compose du
    # VPS dedie ne le met pas non plus.
    environment:
      PORT: 3000
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL est obligatoire}
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crmcabinet}
      POSTGREST_URL: http://postgrest:3001
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL: ${SESSION_TTL:-604800}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-CRM Cabinet}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INPI_USERNAME: ${INPI_USERNAME:-}
      INPI_PASSWORD: ${INPI_PASSWORD:-}
      JEDECLARE_LOGIN: ${JEDECLARE_LOGIN:-}
      JEDECLARE_MDP: ${JEDECLARE_MDP:-}
      JEDECLARE_EDITEUR: ${JEDECLARE_EDITEUR:-}
      JEDECLARE_LOGICIEL: ${JEDECLARE_LOGICIEL:-crmcabinet}
      JEDECLARE_VERSION: ${JEDECLARE_VERSION:-1.0.0}
      JEDECLARE_ID_COMPTE: ${JEDECLARE_ID_COMPTE:-}
      # Comptes de flux supplementaires. Un cabinet qui depose sous deux comptes
      # ne voyait que la moitie de ses teletransmissions : une requete jedeclare
      # ne voit que le compte qu'elle authentifie.
      JEDECLARE_LOGIN_2: ${JEDECLARE_LOGIN_2:-}
      JEDECLARE_MDP_2: ${JEDECLARE_MDP_2:-}
      JEDECLARE_ID_COMPTE_2: ${JEDECLARE_ID_COMPTE_2:-}
      JEDECLARE_LOGIN_3: ${JEDECLARE_LOGIN_3:-}
      JEDECLARE_MDP_3: ${JEDECLARE_MDP_3:-}
      JEDECLARE_ID_COMPTE_3: ${JEDECLARE_ID_COMPTE_3:-}
      VIES_DISABLED: ${VIES_DISABLED:-0}
      APP_VERSION: ${VERSION:-dev}
      UPDATE_DISABLED: ${UPDATE_DISABLED:-0}
    volumes:
      # Fichiers déposés et sauvegardes. À CONSERVER : non reconstructible.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    networks:
      default: {}
      partage:
        aliases:
          # C'est ce nom que le Caddyfile partagé doit viser.
          - crmcabinet

networks:
  default: {}
  # Réseau du Caddy déjà en place. `external` : ce fichier ne le crée pas et ne
  # le supprimera pas — il appartient au projet qui fait tourner Caddy.
  partage:
    external: true
    name: ${RESEAU_PARTAGE:-portail_default}

volumes:
  db_data:
