# ============================================================================
# CRM Cabinet — déploiement derrière un Caddy DÉJÀ EN PLACE.
#
#   docker compose -f docker-compose.partage.yml up -d --build
#
# À utiliser quand le serveur héberge plusieurs applications derrière un seul
# Caddy — le cas du VPS de TARN COMPTA, où le Caddy du portail sert aussi n8n,
# factursci, cottns et portailrecup.
#
# La différence avec `docker-compose.yml` tient en deux points :
#   · aucun service `caddy`, et AUCUN port publié sur l'hôte. Un second Caddy
#     ne pourrait pas se lier à 80/443, déjà pris par le premier ;
#   · `app` rejoint le réseau externe du Caddy sous un alias, ce qui le rend
#     joignable par `reverse_proxy crmcabinet:3000`.
#
# Le bloc à ajouter au Caddyfile partagé est dans `installation/Caddyfile.extrait`.
#
# Pour un VPS dédié — le cas d'un confrère qui installe le produit —, c'est
# `docker-compose.yml` qu'il faut utiliser : il embarque son propre Caddy.
# ============================================================================
# ⚠️ LES JOURNAUX DES CONTENEURS N'AVAIENT AUCUNE LIMITE.
#
# Le pilote `json-file` de Docker conserve TOUT, sans plafond de taille ni de
# duree, jusqu'a ce que le disque du serveur soit plein — et le disque plein
# arrete la base avant d'arreter les journaux. C'est une panne d'exploitation
# qui arrive apres des mois, donc au pire moment : longtemps apres la mise en
# service, sans rapport apparent avec quoi que ce soit.
#
# C'est aussi une question de donnees personnelles. Meme assainis
# (`server/src/journal.ts`), ces journaux gardent la trace horodatee de chaque
# geste fait dans le logiciel. Les conserver indefiniment n'a aucune raison
# d'etre : cinq fichiers de 10 Mo couvrent tres largement le besoin de
# diagnostic, et ce qui est plus vieux ne sert plus a rien.
x-journal: &journal
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *journal
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crmcabinet}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire}
      POSTGRES_INITDB_ARGS: '--locale=C.UTF-8 --encoding=UTF8'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crmcabinet}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Réseau interne au projet uniquement : la base n'est visible ni de l'hôte,
    # ni des autres applications du serveur.
    networks:
      - default

  postgrest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    logging: *journal
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crmcabinet}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: ''
      PGRST_JWT_SECRET: ${SESSION_SECRET:?SESSION_SECRET est obligatoire}
      PGRST_SERVER_PORT: 3001
      PGRST_DB_MAX_ROWS: 10000
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3001'
    # ⚠️ FORME EN DICTIONNAIRE ET NON EN LISTE : on ne peut pas melanger
    # `- default` et un reseau porteur d'alias dans le meme bloc.
    networks:
      default: {}
      lecture:
        aliases:
          # Le nom que les lecteurs visent : `http://crmcabinet-postgrest:3001`.
          - crmcabinet-postgrest

  app:
    build: .
    restart: unless-stopped
    logging: *journal
    # Pas de « init: true » ici : l'image a deja tini en ENTRYPOINT. Les deux
    # ensemble placent l'init de Docker en PID 1 et releguent tini en PID 2, ce
    # qui lui fait perdre precisement ce qu'on lui demande — il l'annonce
    # lui-meme au demarrage (« Tini is not running as PID 1 »). Le compose du
    # VPS dedie ne le met pas non plus.
    environment:
      PORT: 3000
      NODE_ENV: production
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL est obligatoire}
      DATABASE_URL: postgres://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-crmcabinet}
      POSTGREST_URL: http://postgrest:3001
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL: ${SESSION_TTL:-604800}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-CRM Cabinet}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INPI_USERNAME: ${INPI_USERNAME:-}
      INPI_PASSWORD: ${INPI_PASSWORD:-}
      JEDECLARE_LOGIN: ${JEDECLARE_LOGIN:-}
      JEDECLARE_MDP: ${JEDECLARE_MDP:-}
      JEDECLARE_EDITEUR: ${JEDECLARE_EDITEUR:-}
      JEDECLARE_LOGICIEL: ${JEDECLARE_LOGICIEL:-crmcabinet}
      JEDECLARE_VERSION: ${JEDECLARE_VERSION:-1.0.0}
      JEDECLARE_ID_COMPTE: ${JEDECLARE_ID_COMPTE:-}
      # Comptes de flux supplementaires. Un cabinet qui depose sous deux comptes
      # ne voyait que la moitie de ses teletransmissions : une requete jedeclare
      # ne voit que le compte qu'elle authentifie.
      JEDECLARE_LOGIN_2: ${JEDECLARE_LOGIN_2:-}
      JEDECLARE_MDP_2: ${JEDECLARE_MDP_2:-}
      JEDECLARE_ID_COMPTE_2: ${JEDECLARE_ID_COMPTE_2:-}
      JEDECLARE_LOGIN_3: ${JEDECLARE_LOGIN_3:-}
      JEDECLARE_MDP_3: ${JEDECLARE_MDP_3:-}
      JEDECLARE_ID_COMPTE_3: ${JEDECLARE_ID_COMPTE_3:-}
      # ⚠️ CE FICHIER EST UNE PILE COMPLETE, ET NON UNE SURCHARGE de
      # docker-compose.yml. Son bloc `environment:` doit donc etre tenu a jour
      # EN MEME TEMPS que celui de l'autre fichier : une variable ajoutee la-bas
      # et oubliee ici n'atteint pas les instances qui tournent en mode partage.
      #
      # C'est exactement ce qui est arrive a `JEDECLARE_MARQUAGE_AUTORISE_2` :
      # ajoute a docker-compose.yml, verifie par un test... qui ne relisait que
      # ce fichier-la. L'instance concernee, elle, demarre avec celui-ci. Le test
      # de src/coherence.test.ts parcourt desormais les DEUX.
      #
      # Leve la prudence sur UN compte de flux. Voir `.env.exemple`.
      JEDECLARE_MARQUAGE_AUTORISE: ${JEDECLARE_MARQUAGE_AUTORISE:-}
      JEDECLARE_MARQUAGE_AUTORISE_2: ${JEDECLARE_MARQUAGE_AUTORISE_2:-}
      JEDECLARE_MARQUAGE_AUTORISE_3: ${JEDECLARE_MARQUAGE_AUTORISE_3:-}
      VIES_DISABLED: ${VIES_DISABLED:-0}
      APP_VERSION: ${VERSION:-dev}
      UPDATE_DISABLED: ${UPDATE_DISABLED:-0}
    volumes:
      # Fichiers déposés et sauvegardes. À CONSERVER : non reconstructible.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - '3000'
    networks:
      default: {}
      partage:
        aliases:
          # C'est ce nom que le Caddyfile partagé doit viser.
          - crmcabinet

networks:
  default: {}
  # Réseau du Caddy déjà en place. `external` : ce fichier ne le crée pas et ne
  # le supprimera pas — il appartient au projet qui fait tourner Caddy.
  partage:
    external: true
    name: ${RESEAU_PARTAGE:-portail_default}
  # ⚠️ UN SECOND RESEAU, ET PAS LE RESEAU DU CADDY, POUR UNE RAISON DE PORTEE.
  #
  # Une autre application du serveur — FacturSCI — lit la base du CRM par
  # PostgREST. La brancher sur `partage` aurait suffi techniquement, et aurait
  # rendu PostgREST joignable par TOUT ce qui vit derriere le Caddy : n8n,
  # cottns, portailrecup. Ce reseau-ci ne porte que le couple concerne.
  #
  # `external` comme `partage` : ce fichier ne le cree pas. `maj.sh` s'en charge
  # s'il manque — un reseau vide est inerte, contrairement a celui du Caddy.
  #
  # Vecu : cette declaration existait depuis des mois DANS LE SEUL EXEMPLAIRE DU
  # SERVEUR, jamais commitee. Le depot et l'instance divergeaient en silence, et
  # le premier commit touchant ce fichier aurait fait echouer `git pull` au
  # milieu d'une mise a jour.
  lecture:
    external: true
    name: ${RESEAU_LECTURE:-crmcabinet_lecture}

volumes:
  db_data:
